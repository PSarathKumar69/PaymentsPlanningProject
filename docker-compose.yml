# Docker task: convenience wrapper around `docker build`/`docker run` for
# local use — `docker compose up --build`. Not meant for the real AWS
# deployment (there you'd set DATABASE_URL to Neon and skip the volume
# entirely — see Dockerfile's own comments).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Values come from a local .env file (docker compose loads one from
      # this same directory automatically) or your shell environment —
      # never hardcoded here, since this file is committed to git.
      # Create a .env file (already gitignored — see .gitignore/.env.example)
      # with the real values; the ${VAR} syntax below substitutes them in.
      #
      # JWT_SECRET_KEY: required once DATABASE_URL is set (production
      # Postgres) — safe to leave unset for this local-SQLite compose file,
      # since backend/auth/security.py only enforces it in that case.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - PAYMENTS_DB_PATH=/app/backend/db/app.db
      # GEMINI_API_KEY: only needed for the AI-assisted column-mapping step
      # on Excel upload (backend/ai_layer/gemini_client.py) — login and
      # everything else work without it.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Keeps the local SQLite file (and whatever you seed into it via
      # `docker compose exec app python -m backend.db.seed_users ...`)
      # across `docker compose down`/`up` — without this, every fresh
      # container starts from an empty database.
      - payments-db:/app/backend/db

volumes:
  payments-db:
